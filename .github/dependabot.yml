# Dependabot config for a package on the shared CI baseline (awcodes/.github).
version: 2
updates:
  # Composer — keeps this package's dev tooling current (pint, phpstan/larastan,
  # pest + plugins, rector, testbench). Grouped into one weekly PR to cut noise.
  # The runtime `require` block is constrained loosely on purpose; review those bumps.
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait for a release to settle before opening a PR — longer for majors.
    cooldown:
      default-days: 7
      semver-major-days: 14
    # league/glide majors are excluded on purpose. Glide 4 is not a bump: it requires
    # PHP ^8.3 (this package declares ^8.2) and moves intervention/image from v3 to v4.
    # This package calls the Intervention API directly through
    # `Glide::getServer()->getApi()->getImageManager()` without requiring
    # intervention/image itself, so Glide's choice of major silently governs that
    # surface — `read()`, `toJpeg()`, `encodeByExtension()` and `flop()` all move or
    # disappear in v4, and v3's `flip()` (vertical) becomes v4's `flip()` (horizontal by
    # default), which changes behaviour without erroring. Adopting it means raising the
    # PHP floor, declaring intervention/image directly and migrating the image pipeline
    # — a deliberate major, not a Dependabot PR. Minor and patch updates within 3.x
    # still come through. See #725.
    ignore:
      - dependency-name: "league/glide"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  # GitHub Actions — covers the awcodes/.github shared workflow and any actions the
  # package repo adds (release, changelog, etc.).
  #
  # The shared workflow is pinned to a commit SHA with a `# vX.Y.Z` comment, not the
  # moving @v1 tag, so an upstream change reaches this repo only as a Dependabot PR that
  # has to pass CI, never silently on the next run. Dependabot advances the SHA and the
  # comment together to the newest release tag.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
